name: Bug report
description: Installing, updating, launching, or ReLauncher itself doesn't work.
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for reporting! If the problem is inside a program (not with installing or launching it), please report it in that program's repository instead.
  - type: textarea
    id: what
    attributes:
      label: What happened?
      description: What went wrong, and what did you expect? Include any message shown at the bottom of the window.
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      placeholder: |
        1. Select ReEtched
        2. Click Install
        3. See ...
    validations:
      required: true
  - type: input
    id: program
    attributes:
      label: Program
      description: Which program were you installing, updating or launching, if any?
      placeholder: ReEtched 0.1.0
  - type: input
    id: version
    attributes:
      label: ReLauncher version
      description: Shown at the bottom right of the window.
      placeholder: "0.1.0"
    validations:
      required: true
  - type: dropdown
    id: os
    attributes:
      label: Operating system
      options:
        - Windows 11
        - Windows 10
        - macOS
        - Linux
    validations:
      required: true
  - type: textarea
    id: extra
    attributes:
      label: Screenshots or anything else
