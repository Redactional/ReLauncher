# Publishes the website (site/) with the program list to GitHub Pages:
# https://redactional.github.io/ReLauncher/
name: Website

on:
  push:
    branches: [main]
    paths:
      - "site/**"
      - "programs.json"
      - "assets/icons/**"
      - ".github/workflows/pages.yml"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v5
      - name: Assemble the site
        run: |
          mkdir -p _site
          cp -r site/. _site/
          cp programs.json _site/
          cp assets/icons/ReLauncher_1024.png _site/icon.png
          cp assets/icons/linux/ReLauncher_64x64.png _site/favicon.png
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site
      - id: deployment
        uses: actions/deploy-pages@v4
