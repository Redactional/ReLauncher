[package]
name = "relauncher"
version = "0.1.0"
edition = "2024"
license = "MIT OR Apache-2.0"
repository = "https://github.com/Redactional/ReLauncher"
description = "Install, update and launch Re programs"
rust-version = "1.96"

# Installers (`cargo packager --release`): NSIS on Windows, .app/.dmg on macOS,
# .deb/AppImage on Linux.
[package.metadata.packager]
product-name = "ReLauncher"
identifier = "io.github.redactional.relauncher"
description = "Install, update and launch Re programs"
category = "Utility"
icons = [
    "assets/icons/ReLauncher.ico",
    "assets/icons/ReLauncher.icns",
    "assets/icons/linux/ReLauncher_*.png",
]
before-packaging-command = "cargo build --release"

[dependencies]
anyhow = "1"
dirs = "7"
eframe = "0.37"
egui = "0.37"
egui_material_icons = "0.9"
image = { version = "0.25", default-features = false, features = ["png"] }
rfd = "0.17"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
ureq = { version = "3", features = ["json"] }
zip = { version = "9", default-features = false, features = ["deflate"] }

[target.'cfg(windows)'.dependencies]
mslnk = "0.1"

[target.'cfg(windows)'.build-dependencies]
winresource = "0.1"

[profile.dev.package."*"]
opt-level = 2
